name: Sync

# Every 30 minutes, the server's sync job (POST /api/cron/sync,
# src/lib/server/sync.ts): the safety net under the live path. It checks again
# watcher messages whose check failed, pushes once more a scam alert no family
# phone confirmed, and flags an Android phone that stopped reporting. Its runs
# are at /api/ops/sync-health. It needs the CRON_SECRET repository secret, set
# to the server's CRON_SECRET (the same one the hourly purge uses).
#
# Each run bills about a minute of Actions time (some 1,500 a month). GitHub
# may start a scheduled run late or skip one when it is busy; the next run
# catches up, and sync-health says "overdue" after 45 minutes without one.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

env:
  HOST: ${{ vars.PB_HOST || 'https://hackathon-teamg-pausebutton-production.up.railway.app' }}

jobs:
  sync:
    name: Run the sync job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the sync job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret (Settings → Secrets and variables → Actions) to the server's CRON_SECRET. Without it, a message whose check failed is checked again only when Mr Rao taps it."
            exit 1
          fi
          curl -fsS --max-time 120 --retry 2 --retry-all-errors --retry-delay 10 -X POST \
            -H "authorization: Bearer $CRON_SECRET" "$HOST/api/cron/sync" | tee sync.json
          echo "Sync: $(cat sync.json)" >> "$GITHUB_STEP_SUMMARY"
