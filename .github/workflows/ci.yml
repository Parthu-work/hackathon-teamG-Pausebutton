name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, three-phone e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Type check
        run: pnpm next typegen && pnpm typecheck
      - name: Unit, server-flow and quality-gate tests
        # Includes the 40-message test set on the real rules + fast-gate model:
        # fails if any scam is called SAFE or any genuine message SCAM.
        run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Three-phone end-to-end test (Mr Rao, Arjun, Meera)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  claude-eval:
    name: Test set with Claude Haiku
    # Costs a few cents per run, so only on main or when a PR has the "ai-eval" label.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ai-eval')
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the 40 messages with Claude reading the unsure ones
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret: skipping."; exit 0; fi
          pnpm eval --ai haiku

  android-apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0
      - name: Unit tests (the message watcher's rules) and the debug APK
        # PB_HOST: where the web app is deployed (set a repository variable); the person can change it in the app.
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug -PPB_HOST="${{ vars.PB_HOST || 'https://hackathon-teamg-pausebutton-production.up.railway.app' }}"
      - name: Signed with the shared debug key (android/debug.keystore)
        run: bash scripts/check-apk-signer.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pause-button-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests
          retention-days: 7

  android-device-tests:
    name: Android message watcher on an emulator
    # Dedup and the offline queue across a restart, pairing, revocation: android/app/src/androidTest.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-device-test-report
          path: android/app/build/reports/androidTests
          retention-days: 7

