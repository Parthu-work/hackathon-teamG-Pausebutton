name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, three-phone e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Type check
        run: pnpm next typegen && pnpm typecheck
      - name: Unit, server-flow and quality-gate tests
        # Includes the 40-message test set on the real rules + fast-gate model:
        # fails if any scam is called SAFE or any genuine message SCAM.
        run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Three-phone end-to-end test (Mr Rao, Arjun, Meera)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  claude-eval:
    name: Test set with Claude Haiku
    # Costs a few cents per run, so only on main or when a PR has the "ai-eval" label.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ai-eval')
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the 40 messages with Claude reading the unsure ones
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret: skipping."; exit 0; fi
          pnpm eval --ai haiku

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Where the web app is deployed (set a repository variable): the site the app opens.
      PB_HOST: ${{ vars.PB_HOST || 'https://hackathon-teamg-pausebutton-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3 # accepts the SDK licences, so Gradle can fetch what else it needs
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - name: Firebase for push (the GOOGLE_SERVICES_JSON secret, raw or base64)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK has no push, so alerts reach the phone only while the app is open. See docs/deploy.md."
            exit 0
          fi
          out=android/app/google-services.json
          case "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \t\r\n' | head -c 1)" in
            "{") printf '%s' "$GOOGLE_SERVICES_JSON" > "$out" ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$out" ;;
          esac
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert any(c["client_info"]["android_client_info"]["package_name"] == "ai.apty.pausebutton" for c in d["client"])' "$out" \
            || { echo "::error::GOOGLE_SERVICES_JSON is not a google-services.json with the Android app ai.apty.pausebutton."; exit 1; }
      - name: The site the app opens (capacitor.config.ts → the Android project)
        run: pnpm cap:sync
      - name: Unit tests (the message watcher, sync and push rules), debug and release APKs
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease -PPB_HOST="$PB_HOST"
      - name: Signed with the shared debug key (android/debug.keystore)
        # The debug APK is the one published at /pause-button.apk.
        run: bash scripts/check-apk-signer.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pause-button-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests
          retention-days: 7

  android-device-tests:
    name: Android message watcher on an emulator
    # Dedup and the offline queue across a restart, the Idempotency-Key, pairing, revocation,
    # and the 30-minute sync through WorkManager: android/app/src/androidTest.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - name: The Android project's generated parts (Capacitor)
        run: pnpm cap:sync
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-device-test-report
          path: android/app/build/reports/androidTests
          retention-days: 7

