name: Uptime

# Every hour, checks the live site from outside (scripts/check-site.sh): the
# server and database, the download page and the APK. When a check fails it
# opens one "The live site is down" issue (label site-down), so everyone
# watching the repo hears about it; later failures comment on that issue, and
# the first good check closes it.
#
# The same run calls the scheduled purge (POST /api/cron/purge, docs/retention.md):
# message text past 24 hours, activity and push logs past 30 days. It needs
# the CRON_SECRET repository secret, set to the server's CRON_SECRET.
#
# Hourly keeps it inside the free Actions minutes of a private repo (each run
# bills a minute; every 15 minutes would use about 2,900 a month).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

env:
  HOST: ${{ vars.PB_HOST || 'https://hackathon-teamg-pausebutton-production.up.railway.app' }}

jobs:
  check:
    name: Check the live site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Check the live site
        id: site
        run: |
          bash scripts/check-site.sh "$HOST" | tee report.md
          status=${PIPESTATUS[0]}
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Run the scheduled purge
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret (Settings → Secrets and variables → Actions) to the server's CRON_SECRET. Without it, message text is deleted only when someone checks a message."
            exit 1
          fi
          curl -fsS --max-time 60 --retry 2 --retry-all-errors -X POST \
            -H "authorization: Bearer $CRON_SECRET" "$HOST/api/cron/purge" | tee purge.json
          echo "Purge: $(cat purge.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the "site is down" issue
        # The site check failed, or the run failed before it (a failed purge alone opens no issue).
        if: ${{ failure() && steps.site.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s report.md ] || echo "The check could not run. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > report.md
          printf '\n[This run](%s/%s/actions/runs/%s) · fix: Railway → the service → Deployments → logs.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> report.md
          gh label create site-down --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The live site failed its uptime check" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label site-down --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label site-down \
              --title "The live site is down" --body-file report.md
          fi

      - name: Close the "site is down" issue
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label site-down --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "Back up: every check passed at $(date -u '+%Y-%m-%d %H:%M UTC')."
          fi
