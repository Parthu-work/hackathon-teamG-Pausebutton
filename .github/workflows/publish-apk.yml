name: Publish APK to the website

# Builds the Android app for the deployed site and commits it as
# public/pause-button.apk, so <site>/download serves it to anyone who scans the
# QR code. Then waits for the site to redeploy and checks, from the outside,
# that the health check, the download page, the QR and the APK all work.
# Runs by itself when the app changes on main (android/, its Capacitor config
# and placeholder page, or package.json with the Capacitor versions), and from
# the Actions tab (e.g. after changing the deployment address). Its own commit
# only touches public/, so it never triggers itself.
on:
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "capacitor/**", "package.json"]
  workflow_dispatch:
    inputs:
      host:
        description: "The deployed site (https://…, no trailing slash). Empty = the PB_HOST variable, else the Railway URL."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: false

env:
  HOST: ${{ inputs.host || vars.PB_HOST || 'https://hackathon-teamg-pausebutton-production.up.railway.app' }}

jobs:
  publish:
    name: Build, publish and check the APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: The site is up (before publishing)
        run: |
          HOST="${HOST%/}"
          echo "Site: $HOST"
          code=$(curl -s -o health.json -w '%{http_code}' -m 30 "$HOST/api/health" || true)
          echo "GET /api/health → $code $(cat health.json 2>/dev/null)"
          if [ "$code" != 200 ]; then
            echo "::error::$HOST/api/health answered $code. Fix the deployment first (Railway → Deployments → logs; Variables: DATABASE_URL, SESSION_SECRET, FINGERPRINT_SECRET)."
            exit 1
          fi
          for path in /welcome /download /download/qr; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$HOST$path")
            echo "GET $path → $code"
            [ "$code" = 200 ] || { echo "::error::$HOST$path answered $code"; exit 1; }
          done

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3 # accepts the SDK licences, so Gradle can fetch what else it needs
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0

      - name: Firebase for push (the GOOGLE_SERVICES_JSON secret, raw or base64)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK has no push, so alerts reach the phone only while the app is open. See docs/deploy.md."
            exit 0
          fi
          out=android/app/google-services.json
          case "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \t\r\n' | head -c 1)" in
            "{") printf '%s' "$GOOGLE_SERVICES_JSON" > "$out" ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$out" ;;
          esac
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert any(c["client_info"]["android_client_info"]["package_name"] == "ai.apty.pausebutton" for c in d["client"])' "$out" \
            || { echo "::error::GOOGLE_SERVICES_JSON is not a google-services.json with the Android app ai.apty.pausebutton."; exit 1; }

      - name: Build the APK
        run: |
          export PB_HOST="${HOST%/}"
          pnpm cap:sync
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug -PPB_HOST="$PB_HOST"

      - name: The APK opens this site
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          unzip -p "$apk" assets/capacitor.config.json | grep -F "\"url\": \"${HOST%/}\"" || { echo "::error::The APK does not open $HOST"; exit 1; }

      - name: The APK is signed with the shared debug key
        # Same key every build, so a newer APK installs over an older one.
        run: bash scripts/check-apk-signer.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit it to the website
        id: commit
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/pause-button.apk
          sha256sum public/pause-button.apk | cut -d' ' -f1 > apk.sha256
          echo "sha256=$(cat apk.sha256)" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/pause-button.apk
          if git commit -m "Publish the Android app for ${HOST%/}"; then
            # main may have moved while the APK built; this commit only adds one file.
            git pull --rebase --autostash origin main && git push origin HEAD:main
          else
            echo "Unchanged APK: nothing to commit."
          fi

      - name: The site serves this APK (waits for the redeploy)
        run: |
          HOST="${HOST%/}"
          want="${{ steps.commit.outputs.sha256 }}"
          for i in $(seq 1 60); do
            code=$(curl -s -o served.apk -w '%{http_code}' -m 60 "$HOST/pause-button.apk" || true)
            got=$([ "$code" = 200 ] && sha256sum served.apk | cut -d' ' -f1 || echo none)
            echo "try $i: GET /pause-button.apk → $code ($got)"
            if [ "$got" = "$want" ]; then
              echo "### APK is live" >> "$GITHUB_STEP_SUMMARY"
              echo "Download page: $HOST/download · QR: $HOST/download/qr · APK sha256 \`$want\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$HOST still does not serve the new APK after 20 minutes. Check that Railway deploys main automatically, and its latest deployment's logs."
          exit 1
